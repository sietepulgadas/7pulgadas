<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>7 Pulgadas – Vinyl DJ Sets</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
:root{
  --maxw: 900px;
  --pad: clamp(16px, 3vw, 28px);
}

*{ box-sizing: border-box; }

html{ scroll-behavior:smooth; }

/* FUNDIDO INVERSO */
body{
  margin:0;
  font-family: Helvetica, Arial, sans-serif;
  background:#000;
  color:#fff;
  text-align:center;
  opacity:0;
  transition:opacity 1.4s ease;
}
body.loaded{ opacity:1; }

/* MENU */
.top-menu{
  position:fixed;
  top:14px;
  right:14px;
  z-index:2000;
}

.menu-btn{
  border:1px solid rgba(255,255,255,0.25);
  background:rgba(0,0,0,0.45);
  border-radius:12px;
  cursor:pointer;
  backdrop-filter: blur(6px);
}

/* HAMBURGUESA */
.hamburger{
  width:46px;
  height:42px;
  display:flex;
  flex-direction:column;
  justify-content:center;
  gap:7px;
  padding:8px 10px;
}

.hamburger span{
  height:3px;
  background:#fff;
  border-radius:3px;
  transition:0.3s ease;
}

.top-menu.open .hamburger span:nth-child(1){
  transform:translateY(10px) rotate(45deg);
}
.top-menu.open .hamburger span:nth-child(2){
  opacity:0;
}
.top-menu.open .hamburger span:nth-child(3){
  transform:translateY(-10px) rotate(-45deg);
}

.dropdown{
  position:absolute;
  top:48px;
  right:0;
  min-width:190px;
  background:rgba(0,0,0,0.75);
  border-radius:14px;
  overflow:hidden;
  opacity:0;
  pointer-events:none;
  transition:0.2s ease;
}

.top-menu.open .dropdown{
  opacity:1;
  pointer-events:auto;
}

.dropdown a{
  display:block;
  padding:12px 14px;
  color:#fff;
  text-decoration:none;
  font-weight:600;
}

.dropdown a:hover{
  background:rgba(255,255,255,0.1);
}

/* HERO */
header{
  position:relative;
  min-height:100svh;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  padding:var(--pad);
  overflow:hidden;
}

/* CAPA DE IMAGEN + DEFORMACIÓN AL PASAR RATÓN */
header::before{
  content:"";
  position:absolute;
  inset:0;
  background:
    linear-gradient(rgba(0,0,0,0.65), rgba(0,0,0,0.65)),
    url('https://raw.githubusercontent.com/sietepulgadas/7pulgadas/main/assets/Imagen.png') center/cover no-repeat;

  /* arranque desenfocado */
  filter:blur(18px);

  /* desplazamiento "interferencia" controlado por variables */
  transform: translate(var(--dx,0), var(--dy,0)) scale(var(--scale,1.08));
  transition:
    filter 1.8s ease,
    transform 0.12s ease-out;

  z-index:-1;
}

/* Cuando carga, se enfoca */
body.loaded header::before{
  filter:blur(0px);
}

/* ===== EFECTO INTERFERENCIA / GLITCH PARA EL H1 ===== */
.glitch{
  position:relative;
  display:inline-block;
  animation:glitch-skew 3s infinite linear alternate-reverse;
}

.glitch::before,
.glitch::after{
  content: attr(data-text);
  position:absolute;
  left:0;
  top:0;
  width:100%;
  overflow:hidden;
}

.glitch::before{
  left:2px;
  text-shadow:-2px 0 red;
  clip-path: inset(0 0 65% 0);
  animation:glitch-top 2.2s infinite linear alternate-reverse;
}

.glitch::after{
  left:-2px;
  text-shadow:-2px 0 cyan;
  clip-path: inset(65% 0 0 0);
  animation:glitch-bottom 2.7s infinite linear alternate-reverse;
}

@keyframes glitch-top{
  0%{ transform:translate(0); }
  20%{ transform:translate(-2px,2px); }
  40%{ transform:translate(-2px,-2px); }
  60%{ transform:translate(2px,2px); }
  80%{ transform:translate(2px,-2px); }
  100%{ transform:translate(0); }
}

@keyframes glitch-bottom{
  0%{ transform:translate(0); }
  20%{ transform:translate(2px,-2px); }
  40%{ transform:translate(2px,2px); }
  60%{ transform:translate(-2px,-2px); }
  80%{ transform:translate(-2px,2px); }
  100%{ transform:translate(0); }
}

@keyframes glitch-skew{
  0%{ transform:skew(0deg); }
  20%{ transform:skew(1deg); }
  40%{ transform:skew(-1deg); }
  60%{ transform:skew(0.5deg); }
  80%{ transform:skew(-0.5deg); }
  100%{ transform:skew(0deg); }
}
/* ===== FIN GLITCH ===== */

h1{
  margin:0;
  font-weight:700;
  letter-spacing:8px;
  font-size:64px;
}

h2{
  margin-top:18px;
  font-weight:300;
  color:#ddd;
  transform:translateY(20px);
  opacity:0;
  transition:all 1s ease 0.8s;
}

body.loaded h1,
body.loaded h2{
  transform:translateY(0);
  opacity:1;
}
</style>
</head>

<body>

<div class="top-menu" id="topMenu">
  <button class="menu-btn hamburger" id="menuBtn" aria-haspopup="true" aria-expanded="false">
    <span></span><span></span><span></span>
  </button>

  <div class="dropdown" id="dropdown" role="menu" aria-label="Navegación">
    <a href="quienes.html" data-go="quienes.html" role="menuitem">Quiénes somos</a>
    <a href="eventos.html" data-go="eventos.html" role="menuitem">Eventos</a>
    <a href="contacto.html" data-go="contacto.html" role="menuitem">Contacto</a>
  </div>
</div>

<header id="hero">
  <h1 class="glitch" data-text="7 PULGADAS">7 PULGADAS</h1>
  <h2>Música con surco y nostalgia</h2>
</header>

<script>
(() => {
  const topMenu = document.getElementById('topMenu');
  const menuBtn = document.getElementById('menuBtn');

  const closeMenu = () => {
    topMenu.classList.remove('open');
    menuBtn.setAttribute('aria-expanded', 'false');
  };

  const toggleMenu = () => {
    const isOpen = topMenu.classList.toggle('open');
    menuBtn.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
  };

  // Navegación robusta: si existe iframe, cambia el src; si no, navega normal
  const navigate = (page) => {
    try{
      const frame = window.parent && window.parent.document
        ? window.parent.document.getElementById('contentFrame')
        : null;

      if (frame) frame.src = page;
      else window.location.href = page;
    } catch(e) {
      window.location.href = page;
    }
  };

  menuBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    toggleMenu();
  });

  window.addEventListener('click', closeMenu);

  window.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') closeMenu();
  });

  document.querySelectorAll('[data-go]').forEach(a => {
    a.addEventListener('click', (e) => {
      e.preventDefault();
      navigate(a.getAttribute('data-go'));
      closeMenu();
    });
  });

  window.addEventListener('load', () => {
    document.body.classList.add('loaded');
  });

  /* ===== DEFORMACIÓN / INTERFERENCIA AL PASAR RATÓN POR EL HERO ===== */
  const hero = document.getElementById('hero');

  const setVars = (x, y, scale) => {
    hero.style.setProperty('--dx', x + 'px');
    hero.style.setProperty('--dy', y + 'px');
    hero.style.setProperty('--scale', scale);
  };

  hero.addEventListener('mousemove', (e) => {
    const r = hero.getBoundingClientRect();
    const nx = ((e.clientX - r.left) / r.width) - 0.5;   // -0.5..0.5
    const ny = ((e.clientY - r.top) / r.height) - 0.5;  // -0.5..0.5

    // Intensidad "interferencia"
    const dx = nx * 26;
    const dy = ny * 18;

    setVars(dx, dy, 1.12);
  });

  hero.addEventListener('mouseleave', () => {
    setVars(0, 0, 1.08);
  });
})();
</script>

<!-- Música SOLO en la página principal -->
<audio id="bg-music" loop playsinline preload="auto">
  <source src="assets/tema.mp3" type="audio/mpeg">
</audio>

<script>
const audio = document.getElementById('bg-music');

// Activar música con el primer click (requisito de navegador)
document.body.addEventListener('click', () => {
  audio.muted = false;
  audio.play();
}, { once:true });
</script>

</body>
</html>
