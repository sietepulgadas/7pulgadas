<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>7 Pulgadas</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
  body{
    margin:0;
    background:#000;
    overflow:hidden;
  }

  /* iframe ocupa toda la pantalla */
  #contentFrame{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    border:0;
  }
</style>
</head>

<body>

<!-- IFRAME donde se cargan las páginas -->
<iframe
  id="contentFrame"
  src="home.html"
  title="7 Pulgadas"
  allow="autoplay"
></iframe>

<!-- Audio que NO se recarga al navegar -->
<audio id="bg-music" autoplay loop muted playsinline preload="auto">
  <source src="./assets/tema.mp3" type="audio/mpeg">
</audio>

<script>
(() => {
  const audio = document.getElementById('bg-music');

  const tryStartMuted = async () => {
    try { await audio.play(); } catch(e) {}
  };

  const enableSoundOnce = async () => {
    try {
      audio.muted = false;
      audio.volume = 1.0;
      await audio.play();
    } catch(e) {
      audio.muted = true;
    } finally {
      window.removeEventListener('pointerdown', enableSoundOnce);
      window.removeEventListener('touchstart', enableSoundOnce);
      window.removeEventListener('keydown', enableSoundOnce);
    }
  };

  tryStartMuted();
  window.addEventListener('pointerdown', enableSoundOnce, { passive:true });
  window.addEventListener('touchstart', enableSoundOnce, { passive:true });
  window.addEventListener('keydown', enableSoundOnce);
})();
</script>

</body>
</html>
